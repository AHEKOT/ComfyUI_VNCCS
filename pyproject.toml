[project]
name = "vnccs"
description = "VNCCS - Visual Novel Character Creation Suite"
version = "3.2.4"
license = {file = "LICENSE"} 

dependencies = [
    "torch",
    "numpy",
    "Pillow",
    "opencv-python",
    "llama-cpp-python>=0.3.46",
    "safetensors",
    "huggingface-hub[torch]>=0.22",
    "json_repair",
    "aiohttp",
    "pymatting",
    "gsplat==1.5.3; sys_platform == 'linux' or sys_platform == 'win32'",
    "pycolmap-cuda12==4.2.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pycolmap==4.2.1; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/AHEKOT/ComfyUI_VNCCS"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/AHEKOT/ComfyUI_VNCCS/wiki"
"Bug Tracker" = "https://github.com/AHEKOT/ComfyUI_VNCCS/issues"

[tool.comfy]
PublisherId = "vnccs"
DisplayName = "VNCCS - Visual Novel Character Creation Suite"
Icon = "https://github.com/AHEKOT/ComfyUI_VNCCS/raw/refs/heads/main/images/VNCCS_LOGO.png"
